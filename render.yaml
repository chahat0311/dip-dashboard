# Render Blueprint: one Postgres, the Express API, and the React static site.
# In Render: New > Blueprint > pick this repo. Fill the two "sync: false" values when asked.
databases:
  - name: dip-db
    plan: free
    region: singapore
    databaseName: dip_dashboard
    user: dip

services:
  - type: web
    name: dip-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    # Migrations run on every start (they skip what is already applied).
    # Seed runs only while SEED_ON_START is true; set it to false before real data goes in.
    startCommand: npm run migrate && if [ "$SEED_ON_START" = "true" ]; then npm run seed; fi && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        fromDatabase:
          name: dip-db
          property: connectionString
      - key: SEED_ON_START
        value: 'true'
      - key: CORS_ORIGIN
        sync: false   # the static site's URL, e.g. https://dip-web.onrender.com

  - type: web
    name: dip-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # the API's URL, e.g. https://dip-api.onrender.com
