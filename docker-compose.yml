# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dip
      POSTGRES_PASSWORD: dip
      POSTGRES_DB: dip_dashboard
    ports:
      - '5432:5432'
    volumes:
      - dip-pgdata:/var/lib/postgresql/data
volumes:
  dip-pgdata:
